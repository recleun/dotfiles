[audio]
enable_sounds = true

[bar]
order = [ "top", "bottom" ]

    [bar.bottom]
    auto_hide = true
    background_opacity = 0.7
    capsule_radius = 8
    center = [ "media" ]
    enabled = true
    end = [ "launcher_2", "bar_2", "tray" ]
    margin_ends = 0
    position = "bottom"
    radius = 0
    reserve_space = false
    scale = 1.25
    show_on_workspace_switch = false
    start = [ "control-center" ]
    thickness = 48

    [bar.top]
    background_opacity = 0.7
    capsule_radius = 8
    center = [ "active_window", "notifications" ]
    end = [ "tray", "network", "bluetooth", "volume", "brightness", "keyboard_layout", "clock" ]
    margin_edge = 10
    start = [ "control-center", "bar", "workspaces" ]

[config.custom_colors.green]
color = "#00ff00"

[control_center]
hidden_tabs = [ "monitor", "bluetooth" ]

    [[control_center.shortcuts]]
    type = "caffeine"

    [[control_center.shortcuts]]
    type = "nightlight"

    [[control_center.shortcuts]]
    type = "notification"

    [[control_center.shortcuts]]
    type = "power_profile"

[dock]
auto_hide = true
background_opacity = 0.65
icon_size = 18
item_spacing = 0
launcher_position = "start"
magnification_scale = 1.3
margin_edge = 10
reserve_space = false

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@FALLBACK", "lockscreen-login-box@HDMI-A-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@FALLBACK"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 898.0
    output = "FALLBACK"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@FALLBACK".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 1018.0
    output = "HDMI-A-1"
    placement_height = 1200.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[notification]
background_opacity = 0.7
position = "bottom_right"

[osd]
background_opacity = 0.7

[plugin_settings."alexander/game-launcher"]
lutris_enabled = false

[plugin_settings."icefish/phone-connect"]
battery_display = "hidden"
enable_charging_animation = false

[plugin_settings."nomadcxx/gamer-mode"]
show_temps = false

[plugins]
enabled = [ "raycursive/discord-voice", "icefish/phone-connect", "alexander/game-launcher", "noctalia/translator" ]

[shell]
polkit_agent = true
screen_time_enabled = true

    [shell.greeter_sync]
    auto_sync = true

    [shell.launcher]
    compact = true

    [shell.panel]
    open_near_click_control_center = true
    transparency_mode = "glass"

    [shell.screen_corners]
    size = 26

    [shell.screenshot]
    confirm_region = true

[theme]
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "m3-content"

    [theme.templates]
    builtin_ids = [ "btop", "hyprland", "kitty", "starship" ]
    community_ids = [
        "spicetify",
        "pywalfox",
        "discord",
        "obsidian",
        "heroiclauncher",
        "prismlauncher",
        "fastfetch",
        "obs",
        "bat",
        "fzf",
        "lazygit"
    ]

        [theme.templates.user.neovim_colors]
        input_path = "$XDG_CONFIG_HOME/noctalia/templates/neovim.lua"
        output_path = "$XDG_CONFIG_HOME/nvim/lua/noctalia.lua"
        post_hook = "pkill -SIGUSR1 nvim"

        [theme.templates.user.neovim_plugin]
        input_path = "$XDG_CONFIG_HOME/noctalia/templates/base16.lua"
        output_path = "$XDG_CONFIG_HOME/nvim/lua/plugins/base16.lua"

[widget.bar]
type = "raycursive/discord-voice:bar"

[widget.bar_2]
type = "icefish/phone-connect:bar"

[widget.clock]
format = "{:%I:%M %p}"

[widget.keyboard_layout]
show_glyph = false

[widget.launcher_2]
type = "alexander/game-launcher:launcher"

[widget.media]
artist_first = true
capsule = true
font_scale = 0.85

[widget.network]
show_label = false

[widget.taskbar]
capsule_radius = "auto"
group_by_workspace = true
icon_scale = 1.2
item_spacing = 18
show_workspace_label = false

[widget.tray]
drawer = true
drawer_item_size = 18.0
hide_passive = false

[widget.volume]
show_label = false
